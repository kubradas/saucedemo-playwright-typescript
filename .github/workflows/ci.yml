name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run format:check

      - run: npx playwright install --with-deps

      - run: npm test

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
